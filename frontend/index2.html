<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reels Downloader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui;
      background: #0f172a;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
    }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      margin-top: 10px;
    }
    button {
      background: #4f46e5;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .loader {
      margin-top: 20px;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #334155;
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      margin: auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .error { color: #f87171; margin-top: 10px; }
  </style>
</head>

<body>

<div class="card">
  <h2>Instagram Reels Downloader</h2>

  <input id="url" placeholder="Paste Reel link" />
  <button onclick="prepare()">Prepare Download</button>

  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <p id="msg"></p>
  </div>

  <div id="done" class="hidden">
    <p>Ready 🎉</p>
    <button id="downloadBtn">Download MP4</button>
  </div>

  <div id="error" class="error"></div>
</div>

<script>
const messages = [
  "Fetching reel…",
  "Preparing file…",
  "Almost ready…"
];

let i = 0;
let interval;

function startLoader() {
  document.getElementById("loader").classList.remove("hidden");
  document.getElementById("done").classList.add("hidden");

  const msg = document.getElementById("msg");
  msg.textContent = messages[0];

  interval = setInterval(() => {
    i = (i + 1) % messages.length;
    msg.textContent = messages[i];
  }, 1200);
}

function stopLoader() {
  clearInterval(interval);
  document.getElementById("loader").classList.add("hidden");
}

async function prepare() {
  const url = document.getElementById("url").value.trim();
  const error = document.getElementById("error");
  error.textContent = "";

  if (!url) {
    error.textContent = "Paste a Reel link.";
    return;
  }

  startLoader();

  try {
    const res = await fetch(
      `http://localhost:8000/prepare?url=${encodeURIComponent(url)}`
    );
    if (!res.ok) throw new Error();

    const data = await res.json();
    stopLoader();

    document.getElementById("done").classList.remove("hidden");
    document.getElementById("downloadBtn").onclick = () => {
      window.location.href = `http://localhost:8000/download/${data.token}`;
    };
  } catch {
    stopLoader();
    error.textContent = "Failed to prepare video.";
  }
}
</script>

</body>
</html>
